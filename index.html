
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOCKMOCHI YT - Sensi Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        /* Background Video Styling */
        video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
            filter: brightness(1.35) contrast(1.15);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: -1;
        }
        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff2a2a;
            letter-spacing: 1px;
        }
        .subscribe-btn {
            background-color: #ff2a2a;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Generator Box */
        .container {
            background: rgba(20, 20, 20, 0.85);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #ff2a2a;
            margin-top: 60px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #fff;
        }
        p {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            text-align: center;
        }
        input::placeholder {
            color: #777;
        }
        .generate-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff2a2a, #ff7a00);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ff7a00;
            border-radius: 6px;
            display: none;
            text-align: left;
        }
        .result-box h3 {
            color: #ff7a00;
            font-size: 15px;
            margin-bottom: 8px;
            text-align: center;
        }
        .result-box p {
            color: #fff;
            font-size: 13px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <!-- Background Video -->
    <video autoplay muted loop playsinline>
        <source src="video_57a3b9c55ed4.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Header -->
    <header>
        <div class="logo">JOCKMOCHI YT</div>
        <button class="subscribe-btn" onclick="window.open('https://youtube.com/@Jockmochi-YT', '_blank')">SUBSCRIBE</button>
    </header>

    <!-- Sensi Generator Card -->
    <div class="container">
        <h1>Sensi Generator</h1>
        <p>Enter your device model to find optimal sensitivity.</p>
        <input type="text" id="deviceInput" placeholder="Device model (e.g. Vivo T2)">
        <button class="generate-btn" onclick="generateSensi()">GENERATE</button>
        
        <div class="result-box" id="resultBox">
            <h3 id="resTitle">Sensitivity Settings</h3>
            <p id="resGen"></p>
            <p id="resRed"></p>
            <p id="res2x"></p>
            <p id="res4x"></p>
            <p id="resSniper"></p>
            <p id="resFreelook"></p>
        </div>
    </div>

    <script>
        function generateSensi() {
            const device = document.getElementById('deviceInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            if (device === "") {
                alert("தயவுசெய்து உங்கள் போன் மாடலை உள்ளிடவும்!");
                return;
            }

            document.getElementById('resTitle').innerText = device + " - Best Sensi:";
            document.getElementById('resGen').innerText = "General: " + (Math.floor(Math.random() * 6) + 94);
            document.getElementById('resRed').innerText = "Red Dot: " + (Math.floor(Math.random() * 6) + 91);
            document.getElementById('res2x').innerText = "2x Scope: " + (Math.floor(Math.random() * 6) + 92);
            document.getElementById('res4x').innerText = "4x Scope: " + (Math.floor(Math.random() * 6) + 90);
            document.getElementById('resSniper').innerText = "Sniper Scope: " + (Math.floor(Math.random() * 30) + 40);
            document.getElementById('resFreelook').innerText = "Free Look: " + (Math.floor(Math.random() * 20) + 75);
            
            resultBox.style.display = "block";
        }
    </script>
</body>
</html>
