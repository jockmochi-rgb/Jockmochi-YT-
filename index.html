<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jockmochi YT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow-x: hidden;
            background-color: #000;
            color: #fff;
        }

        /* பின்னணி வீடியோ */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(45%);
        }

        /* பிரதான கண்டெய்னர் */
        .container {
            position: relative;
            z-index: 1;
            max-width: 450px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* யூடியூப் சேனல் பெயர் (லிங்க் ஸ்டைல்) */
        .channel-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            color: #ff0055;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }

        .channel-title:hover {
            transform: scale(1.05);
            color: #ff3377;
        }

        .subtitle {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #ddd;
        }

        /* டிவைஸ் உள்ளீடு பாக்ஸ் */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: #ccc;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ff0055;
        }

        /* ஸ்டார்ட் பட்டன் */
        .start-btn {
            width: 100%;
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: 0.3s;
            margin-bottom: 25px;
        }

        .start-btn:hover {
            opacity: 0.9;
        }

        /* ஜெனரல் செட்டிங்ஸ் பகுதி (முதலில் மறைக்கப்பட்டிருக்கும்) */
        .settings-card {
            display: none;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-header {
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #ff0055;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: #fff;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: 0.95rem;
            color: #eee;
        }

        .setting-value {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- பின்னணி வீடியோ -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="video_57a3b9c55ed4.mp4" type="video/mp4">
        உங்கள் பிரவுசர் வீடியோ டேக்கை ஆதரிக்கவில்லை.
    </video>

    <!-- முதன்மை உள்ளடக்கம் -->
    <div class="container">
        <!-- உங்கள் YouTube சேனல் லிங்க் (இங்கு உங்கள் உண்மையான சேனல் லிங்க்கை மாற்றிக் கொள்ளவும்) -->
        <a href="https://www.youtube.com/@JockmochiYT" target="_blank" class="channel-title">Jockmochi YT</a>
        <p class="subtitle">வரவேற்கிறோம்!</p>

        <!-- போன் டிவைஸ் உள்ளீடு -->
        <div class="input-group">
            <label for="deviceInput">உங்கள் போன் டிவைஸ் பெயரை உள்ளிடவும்:</label>
            <input type="text" id="deviceInput" placeholder="எ.கா: Vivo T2 5G">
        </div>

        <!-- START GAME பட்டன் -->
        <button class="start-btn" onclick="showSettings()">START GAME</button>

        <!-- ஜெனரல் செட்டிங்ஸ் பாக்ஸ் (Start கொடுத்தவுடன் வெளிப்படும்) -->
        <div class="settings-card" id="settingsCard">
            <div class="settings-header">General Settings</div>

            <div class="setting-item">
                <span class="setting-label">Entered Device:</span>
                <span class="setting-value" id="displayDevice">Vivo T2 5G</span>
            </div>

            <div class="setting-item">
                <span class="setting-label">Game Status:</span>
                <span class="setting-value" style="color: #00ff88;">Ready to Play</span>
            </div>

            <div class="setting-item">
                <span class="setting-label">Matchmaking:</span>
                <span class="setting-value" style="color: #00bbff;">Squad / Ranked</span>
            </div>
        </div>
    </div>

    <script>
        function showSettings() {
            const deviceInput = document.getElementById('deviceInput').value;
            const displayDevice = document.getElementById('displayDevice');
            const settingsCard = document.getElementById('settingsCard');

            if (deviceInput.trim() !== "") {
                displayDevice.textContent = deviceInput;
            } else {
                displayDevice.textContent = "Vivo T2 5G"; // Default
            }

            // செட்டிங்ஸ் கார்டைக் காட்டுதல்
            settingsCard.style.display = "block";
        }
    </script>

</body>
</html>
