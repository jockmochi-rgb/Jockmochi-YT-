
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOCKMOCHI YT - Sensi Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(1.35) contrast(1.15);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: -1;
        }
        header {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff2a2a;
            letter-spacing: 1px;
        }
        .subscribe-btn {
            background-color: #ff2a2a;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .container {
            background: rgba(20, 20, 20, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #ff2a2a;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }
        p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input::placeholder {
            color: #777;
        }
        .generate-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff2a2a, #ff7a00);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .result-container {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 8px;
            display: none;
            text-align: left;
            border: 1px solid #ff7a00;
        }
        .result-container h2 {
            font-size: 18px;
            color: #ff7a00;
            margin-bottom: 10px;
            text-align: center;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .result-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <video autoplay muted loop playsinline>
        <source src="video_57a3b9c5sed4.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <header>
        <div class="logo">JOCKMOCHI YT</div>
        <button class="subscribe-btn" onclick="window.open('https://youtube.com/@Jockmochi-YT', '_blank')">SUBSCRIBE</button>
    </header>

    <div class="container">
        <h1>Sensi Generator</h1>
        <p>Enter your device model to find optimal sensitivity.</p>
        <input type="text" id="deviceInput" placeholder="Device model (e.g. Vivo T2)">
        <button class="generate-btn" onclick="generateSensitivity()">GENERATE</button>
        
        <div id="resultContainer" class="result-container">
            <h2>Optimal Sensitivity</h2>
            <div class="result-item"><span>General:</span> <span>95 - 100</span></div>
            <div class="result-item"><span>Red Dot:</span> <span>85 - 90</span></div>
            <div class="result-item"><span>2x Scope:</span> <span>80 - 85</span></div>
            <div class="result-item"><span>4x Scope:</span> <span>75 - 80</span></div>
            <div class="result-item"><span>Sniper Scope:</span> <span>50 - 60</span></div>
        </div>
    </div>

    <script>
        function generateSensitivity() {
            var device = document.getElementById("deviceInput").value;
            if (device.trim() !== "") {
                document.getElementById("resultContainer").style.display = "block";
            } else {
                alert("Please enter your device model first.");
            }
        }
    </script>
</body>
</html>
