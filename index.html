    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      color: #fff;
      background: #000;
    }

    /* 1. Background Video (உங்கள் Gameplay வீடியோ) */
    .video-bg { 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      object-fit: cover;
      filter: brightness(0.35) contrast(1.2);
    }

    /* Gradient Dark Overlay for 3D Look */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 85, 0.25) 0%, rgba(0, 0, 0, 0.9) 100%);
      z-index: -1;
    }

    /* 2. Top Header with Jockmochi YT Channel Link */
    header {
      width: 100%;
      padding: 16px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 2px solid rgba(255, 0, 85, 0.5);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(255, 0, 85, 0.3);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ff0055, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #ff0000, #b30000);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .yt-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
    }
